name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          git archive --format=tar.gz --prefix="tidegate-${version}/" -o "dist/tidegate-${version}.tar.gz" HEAD
          git archive --format=zip --prefix="tidegate-${version}/" -o "dist/tidegate-${version}.zip" HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Tidegate ${GITHUB_REF_NAME#v}" --generate-notes
