name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tidegate version
      description: Output of `tidegate --version`
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: CachyOS, KDE Plasma 6 (Wayland)
    validations:
      required: true
  - type: textarea
    id: audio
    attributes:
      label: Audio server info
      description: Output of `pactl info` and `pipewire --version`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Start `tidegate` from a terminal and paste anything it prints.
      render: text
